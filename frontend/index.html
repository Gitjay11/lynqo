<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lynqo — The campus community platform for college students. Post updates, share anonymously, and chat with classmates in real time." />
    <title>Lynqo — Campus Community</title>
    <!-- Anti-FOUT: apply saved theme BEFORE React bundle loads to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('lynqo-theme');
          if (theme === 'warm-dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
